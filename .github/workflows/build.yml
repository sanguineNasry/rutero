name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/rutero

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          path: rutero

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verificar Java y Gradle
        run: |
          java -version
          javac -version
          ./gradlew --version

      - name: Asegurar permiso de ejecución en gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ github.workspace }}/rutero/app/build/outputs/apk/debug/app-debug.apk
