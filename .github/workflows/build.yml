name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rutero_Extractor_Android # 👈 Aquí va el nombre exacto de tu carpeta
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          path: Rutero_Extractor_Android # Se descarga dentro de esta carpeta

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de depuración (Debug)
        run: ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Rutero_Extractor_Android/app/build/outputs/apk/debug/app-debug.apk
