jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/Rutero_Extractor_Android_fuente

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          path: Rutero_Extractor_Android_fuente

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        run: ./gradlew assembleDebug

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Rutero_Extractor_Android_fuente/app/build/outputs/apk/debug/app-debug.apk
