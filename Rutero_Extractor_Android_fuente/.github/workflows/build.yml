name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rutero_Extractor_Android_fuente
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          path: Rutero_Extractor_Android_fuente

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # 👇 ESTO ES LA MAGIA: Le decimos a GitHub que genere el gradlew
      - name: Generar Gradle Wrapper
        run: gradle wrapper

      # Le damos permisos de ejecución (por si acaso)
      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      # Creamos el archivo que le dice dónde está el SDK de Android en GitHub
      - name: Crear local.properties con la ruta del SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Ahora sí, compilamos
      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Rutero_Extractor_Android_fuente/app/build/outputs/apk/debug/app-debug.apk
